name: "7:00 AM - Weekly Plan Drop (Friday)"

on:
  schedule:
    - cron: '0 22 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run script
        run: python3 scripts/telegram_bot_friday_7am.py
        env:
          TZ: "Asia/Phnom_Penh"
          TARGET_TIME: "07:00"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Save counter
        run: |
          git config user.email "bot@dpss.school"
          git config user.name "DPSS Bot"
          git pull --rebase --autostash origin main
          git add counter.json
          git diff --staged --quiet || git commit -m "Update counter [skip ci]"
          git push
