name: "7:20 AM - Weekly Meeting Reminder (Wednesday)"

on:
  schedule:
    - cron: '20 0 * * 3'  # 7:20 AM UTC+7, Wednesday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: python3 scripts/telegram_bot_wednesday_720am.py
      - name: Save counter
        run: |
          git config user.email "bot@dpss.school"
          git config user.name "DPSS Bot"
          git add counter.json
          git diff --staged --quiet || git commit -m "Update counter [skip ci]"
          git push
