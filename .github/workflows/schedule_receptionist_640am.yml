name: "6:40 AM - Receptionist Morning (Mon-Fri)"

on:
  schedule:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: python3 scripts/receptionist_bot_640am.py
        env:
          TZ: "Asia/Phnom_Penh"
          TARGET_TIME: "06:40"
          RECEPTIONIST_BOT_TOKEN: ${{ secrets.RECEPTIONIST_BOT_TOKEN }}
