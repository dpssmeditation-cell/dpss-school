name: "11:30 AM - Receptionist Afternoon Shift (Mon-Fri)"

on:
  schedule:
    - cron: '45 3 * * 1-5'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: python3 scripts/receptionist_bot_1130am.py
        env:
          TZ: "Asia/Phnom_Penh"
          TARGET_TIME: "11:30"
          RECEPTIONIST_BOT_TOKEN: ${{ secrets.RECEPTIONIST_BOT_TOKEN }}
