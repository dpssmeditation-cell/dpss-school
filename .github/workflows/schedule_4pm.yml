name: "4:00 PM - Afternoon English FT (Mon-Fri)"

on:
  schedule:
    - cron: '15 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run script
        run: python3 scripts/telegram_bot_4pm.py
        env:
          TZ: "Asia/Phnom_Penh"
          TARGET_TIME: "16:00"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Save counter
        run: |
          git config user.email "bot@dpss.school"
          git config user.name "DPSS Bot"
          git pull --rebase --autostash origin main
          git add counter.json
          git diff --staged --quiet || git commit -m "Update counter [skip ci]"
          git push
