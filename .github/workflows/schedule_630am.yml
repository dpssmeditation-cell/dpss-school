name: "6:30 AM - Late Students & Attendance (Mon-Fri)"

on:
  schedule:
    - cron: '30 23 * * 0-4'  # 6:30 AM UTC+7 (23:30 UTC Sun-Thu)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run script
        run: python3 scripts/telegram_bot_630am.py
      - name: Save counter
        run: |
          git config user.email "bot@dpss.school"
          git config user.name "DPSS Bot"
          git pull --rebase --autostash origin main
          git add counter.json
          git diff --staged --quiet || git commit -m "Update counter [skip ci]"
          git push
