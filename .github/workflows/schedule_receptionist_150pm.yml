name: "1:50 PM - Receptionist Late Payment (Mon-Fri)"

on:
  schedule:
    - cron: '5 6 * * 1-5'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: python3 scripts/receptionist_bot_150pm.py
        env:
          TZ: "Asia/Phnom_Penh"
          TARGET_TIME: "13:50"
          RECEPTIONIST_BOT_TOKEN: ${{ secrets.RECEPTIONIST_BOT_TOKEN }}
