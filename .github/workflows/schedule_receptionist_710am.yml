name: "6:40 AM - Receptionist Morning (Mon-Fri)"

on:
  schedule:
    - cron: '40 23 * * 0-4'  # 6:40 AM UTC+7 (23:40 UTC Sun-Thu)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: python3 scripts/receptionist_bot_710am.py
